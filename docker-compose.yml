services:
  ppmmx:
    build: .
    image: ppmmx:latest
    container_name: ppmmx
    restart: unless-stopped
    # Public reachability: webRTC's ICE candidate must be the HOST's public IP,
    # or viewers/publishers (and origin -> edge/record forwarding) cannot connect.
    # The default bridge network only exposes the container's private IP, so for
    # a publicly reachable node uncomment the next line AND delete the `ports:`
    # block below (ignored under host networking). Keep bridge + set
    # `webrtcAdditionalHosts: [<public-ip>]` in a custom mmx.yml instead if you
    # need host-side port remapping. See README "公网可达性与多节点转发".
    # network_mode: host
    environment:
      # deploy.sh/deploy.ps1 always write an explicit MMX_ROLE (resolved from
      # MMX_LICENSE_CODE via ppcenter's /v1/ppmmx/bootstrap before this file
      # is even read) - this default only matters for the manual "想手动控制每
      # 一步" path in README.md.
      MMX_ROLE: ${MMX_ROLE:-standalone}
      # Secrets: DotenvValue (ppmmx's internal/conf) reads a plain env var
      # before falling back to a .env file, so passing these as container
      # env vars (via this env_file) is sufficient - no file needs to be
      # mounted into the container.
      #
      # MMX_NODE_SECRET is optional: a self-hosted node deployed with only a
      # license code authenticates with MMX_LICENSE_CODE alone (nodeSecret
      # was already generated server-side when the node was created in
      # console, and ppcenter resolves it from the license code - see
      # ppcenter's GetCredentialByLicenseCode). Set it only if you were
      # issued one explicitly and want to use it instead.
      MMX_NODE_SECRET: ${MMX_NODE_SECRET:-}
      MMX_LICENSE_CODE: ${MMX_LICENSE_CODE:?set MMX_LICENSE_CODE in .env - see .env.example}
      # MTX_* overrides apply on top of whichever conf/<role>.yml the
      # entrypoint picks - see internal/conf/env in the ppmmx repo for the
      # generic <PREFIX>_<JSON TAG> mechanism this relies on.
      MTX_MMXCONTROLURL: ${MMX_CONTROL_URL:-wss://api.pp-cdn.org/ws/mmx}
      MTX_MMXNODEREGION: ${MMX_NODE_REGION:-self-hosted}
      MTX_MMXNODECAPACITY: ${MMX_NODE_CAPACITY:-100}
      MTX_MMXWEBRTCBASEURL: ${MMX_WEBRTC_BASE_URL:-}
      MTX_MMXPUBLISHURL: ${MMX_PUBLISH_URL:-}
      # Enhanced RTMP (ERTMP) ingest address advertised to ppcenter. Empty
      # clears it (the yml default is a CHANGE_ME placeholder), which is what
      # non-origin roles want.
      MTX_MMXRTMPPUBLISHURL: ${MMX_RTMP_PUBLISH_URL:-}
      # Shared secret for mmx-to-mmx forwarding (origin -> your own edge/record
      # nodes). Set the SAME value in every node's .env. Only needed when using
      # forwardMmx; see README "公网可达性与多节点转发".
      MMX_FORWARD_SECRET: ${MMX_FORWARD_SECRET:-}
      # Public Ed25519 verify key(s) for the signed publish token - NOT a
      # secret (a public key can only verify, never forge). "kid:base64,...".
      # Lets this node verify ppcenter-issued WHIP/SRT publish tokens without
      # holding any platform secret. See docs/obs-whip-publish-auth-protocol.md.
      WHIP_AUTH_PUBLIC_KEYS: ${WHIP_AUTH_PUBLIC_KEYS:-}
      # Optional recording upload (standalone/record roles). All blank = round
      # recordings stay on the local data volume and are not uploaded. See
      # .env.example "录像上传".
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-}
      S3_ACCESS_PASS: ${S3_ACCESS_PASS:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_HTTPS_DOMAIN: ${S3_HTTPS_DOMAIN:-}
      S3_ACL: ${S3_ACL:-}
    ports:
      - "${MMX_WEBRTC_PORT:-8888}:8888"
      - "${MMX_WEBRTC_UDP_PORT:-8188}:8188/udp"
      - "${MMX_ADMIN_PORT:-8080}:8080"
      - "${MMX_API_PORT:-9996}:9996"
      - "${MMX_SRT_PORT:-7890}:7890/udp"
      - "${MMX_RTMP_PORT:-1935}:1935/tcp"
    volumes:
      - mmx-data:/app/data
      - mmx-logs:/app/logs
      # Uncomment to use your own config instead of the bundled
      # conf/<role>.yml template (see README.md "自定义配置"):
      # - ./mmx.yml:/app/mmx.yml:ro

  # Public HTTPS front for the playback endpoint (WHEP + the ABR WS). mmx keeps
  # serving plain HTTP on :8888 - the origin's forwardMmx hits that directly -
  # so this only adds the TLS listener a browser needs: an https player page
  # blocks a plain-http edge (mixed content), which is what breaks edge-only
  # playback. deploy.sh/deploy.ps1 write ./Caddyfile with the hostname
  # ppcenter's POST /v1/ppmmx/provision assigned this node; Caddy obtains and
  # renews the certificate for it automatically (ACME over 80/443). When the
  # feature is off (ppcenter has no cloudflare config) the generated Caddyfile
  # is empty and Caddy just idles.
  caddy:
    image: caddy:2
    container_name: ppmmx-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ppmmx

volumes:
  mmx-data:
  mmx-logs:
  caddy-data:
  caddy-config:
